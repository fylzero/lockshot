[package]
name = "lockshot"
version = "1.6.1"
description = "Screenshot capture and annotation for macOS, Windows, and Linux"
authors = ["RazorKode LLC"]
license = "MIT"
edition = "2021"

[lib]
name = "lockshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp"] }
flate2 = "1"
drag = "2.1.1"
tauri-plugin-autostart = "2"
# Scrolling Capture: moves the pointer and sends scroll-wheel events.
enigo = { version = "0.6", features = ["platform_specific"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Dragging the editor's file icon out as a file.
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSImage", "NSPasteboard", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGGeometry", "CGWindow"] }
# Text from Scrolling Capture pages, read with Apple Vision.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSOperation", "NSURL", "NSDictionary", "NSString", "NSError", "NSValue"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "VNUtils"] }
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Optimize dependencies in dev builds: screen capture and image handling
# are many times slower unoptimized, which made dev captures feel sluggish.
# Lockshot's own code stays unoptimized for quick rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
