[package]
name = "lockshot"
version = "0.2.1"
description = "Screenshot capture and annotation for macOS, Windows, and Linux"
authors = ["RazorKode LLC"]
license = "MIT"
edition = "2021"

[lib]
name = "lockshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp"] }
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Optimize dependencies in dev builds: screen capture and image handling
# are many times slower unoptimized, which made dev captures feel sluggish.
# Lockshot's own code stays unoptimized for quick rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
